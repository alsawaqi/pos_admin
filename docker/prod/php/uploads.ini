; LAUNCH-P1 P1-7 - merchant documents (phone photos of a CR or an ID card)
; can be several megabytes. The app validates a 10 MB maximum per file
; (UploadMerchantDocumentRequest max:10240); PHP must accept at least that,
; with headroom for the multipart body around the file.
; PHP's defaults (2M / 8M) made larger uploads fail before reaching the app.
upload_max_filesize = 12M
post_max_size = 16M
